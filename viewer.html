<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOMPAS-3D viewer</title>
<style>
  :root { --bg:#1e2227; --panel:#272c33; --line:#3a414b; --text:#dde2e8; --muted:#8b95a3; --accent:#4da3ff; }
  @media (prefers-color-scheme: light) { :root { --bg:#eef1f4; --panel:#fff; --line:#d5dae0; --text:#1d2329; --muted:#667180; --accent:#0a6fd6; } }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,Segoe UI,sans-serif; }
  #app { display:grid; grid-template-columns:300px 1fr; height:100vh; height:100dvh; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:16px; overflow:auto; display:flex; flex-direction:column; min-height:0; }
  /* custom translucent scrollbar */
  aside { scrollbar-width:thin; scrollbar-color:rgba(128,138,152,.4) transparent; }
  aside::-webkit-scrollbar { width:8px; }
  aside::-webkit-scrollbar-track { background:transparent; }
  aside::-webkit-scrollbar-thumb { background:rgba(128,138,152,.35); border-radius:8px; border:2px solid transparent; background-clip:content-box; }
  aside::-webkit-scrollbar-thumb:hover { background:rgba(128,138,152,.65); background-clip:content-box; }
  aside .body { flex:1 0 auto; }
  .head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 12px; }
  h1 { font-size:16px; margin:0; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 6px; }
  select { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  select option { color:#000; }
  button, label.btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 12px; cursor:pointer; font:inherit; }
  button.sec { background:transparent; color:var(--text); border:1px solid var(--line); margin:0 4px 6px 0; }
  .row { display:flex; flex-wrap:nowrap; align-items:center; gap:10px; }
  .row label { white-space:nowrap; }
  .row button.sec { margin:0; padding:6px 12px; white-space:nowrap; }
  #exp3d .row, #exp2d .row { margin-bottom:6px; }
  #exp3d .row button, #exp2d .row button { flex:1 1 0; }
  .lang { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; flex:none; }
  .lang button { background:transparent; color:var(--muted); border:0; border-radius:0; margin:0; padding:4px 9px; font-size:12px; }
  .lang button.on { background:var(--accent); color:#fff; }
  input[type=file] { display:none; }
  table { width:100%; border-collapse:collapse; }
  td { padding:2px 0; vertical-align:top; } td:first-child { color:var(--muted); padding-right:8px; white-space:nowrap; }
  .part { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--line); }
  .sw { width:12px; height:12px; border-radius:3px; margin-top:4px; flex:none; }
  #view { position:relative; min-height:300px; min-width:0; }
  canvas { display:block; width:100%; height:100%; }
  #drop { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(77,163,255,.18); border:2px dashed var(--accent); font-size:18px; pointer-events:none; }
  #msg { position:absolute; left:12px; bottom:12px; right:12px; color:var(--muted); font-size:12px; pointer-events:none; }
  #err { color:#e5484d; margin-top:8px; white-space:pre-wrap; }
  footer { flex:none; margin-top:20px; padding-top:10px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; text-align:center; }
  footer a { color:var(--accent); text-decoration:none; } footer a:hover { text-decoration:underline; }
  #menu, #scrim { display:none; }
  /* phones and narrow windows: the side panel becomes a drawer opened with the menu button */
  @media (max-width:720px) {
    #app { grid-template-columns:1fr; }
    aside { position:fixed; z-index:30; left:0; top:0; bottom:0; width:min(88vw,340px); transform:translateX(-102%); transition:transform .2s ease; border-right:1px solid var(--line); box-shadow:0 0 24px rgba(0,0,0,.35); padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
    body.menu-open aside { transform:none; }
    #menu { display:flex; align-items:center; justify-content:center; position:fixed; z-index:20; left:10px; top:calc(10px + env(safe-area-inset-top)); width:42px; height:42px; padding:0; font-size:22px; line-height:1; box-shadow:0 2px 10px rgba(0,0,0,.3); }
    body.menu-open #menu { display:none; }
    #scrim { z-index:25; position:fixed; inset:0; background:rgba(0,0,0,.45); }
    body.menu-open #scrim { display:block; }
    #msg { bottom:calc(10px + env(safe-area-inset-bottom)); }
    #drop { font-size:15px; }
  }
</style>
</head>
<body>
<button id="menu" aria-label="Menu" data-i-label="menu">&#9776;</button>
<div id="scrim"></div>
<div id="app">
  <aside>
    <div class="body">
      <div class="head">
        <h1>KOMPAS-3D viewer</h1>
        <div class="lang" role="group" aria-label="Language"><button id="lang-en" data-lang="en">EN</button><button id="lang-ru" data-lang="ru">RU</button></div>
      </div>
      <label class="btn"><span data-i="open">Open .m3d / .a3d / .cdw / .frw / .spw</span><input id="file" type="file" accept=".m3d,.a3d,.cdw,.frw,.spw" multiple></label>
      <select id="sample" class="sec" style="margin-top:8px;width:100%"></select>
      <div style="color:var(--muted);font-size:12px;margin-top:6px" data-i="hint">For an assembly, select the .a3d together with its .m3d parts (several files at once).</div>
      <div id="err"></div>
      <h2 data-i="h_file">File</h2><table id="meta"></table>
      <h2 data-i="h_dims">Dimensions (mm)</h2><table id="dims"></table>
      <h2 data-i="h_bodies">Bodies</h2><div id="parts"></div>
      <h2 data-i="h_view">View</h2>
      <div class="row">
        <label><input type="checkbox" id="edges" checked> <span data-i="edges">edges</span></label>
        <label><input type="checkbox" id="wire"> <span data-i="wire">wireframe</span></label>
        <button class="sec" id="fit" data-i="fit">Fit</button>
      </div>
      <div id="exp3d">
        <h2 data-i="h_export">Export</h2>
        <div class="row">
          <button class="sec" id="stlAll" data-i="stl_all" data-i-title="stl_all_title">STL</button>
          <button class="sec" id="stlSep" data-i="stl_sep" data-i-title="stl_sep_title">STL .zip</button>
        </div>
        <label><input type="checkbox" id="onlyVis" checked> <span data-i="only_sel">selected bodies only</span></label>
      </div>
      <div id="exp2d" style="display:none">
        <h2 data-i="h_export">Export</h2>
        <div class="row">
          <button class="sec" id="dxf">DXF</button>
          <button class="sec" id="print" data-i="print">Print</button>
        </div>
      </div>
    </div>
    <footer>&copy; 2026 turovnikoff<br><a href="https://github.com/turovnikoff/kompas-3d-viewer" target="_blank" rel="noopener">GitHub</a></footer>
  </aside>
  <div id="view"><div id="drop" data-i="drop">Drop a file here</div><div id="msg" data-i="msg">LMB — rotate, wheel — zoom, RMB — pan</div></div>
</div>

<script src="dist/samples.js"></script>
<script src="dist/viewer.bundle.js"></script>

</body>
</html>
